services:
  mautrix-chatgpt:
    container_name: mautrix-chatgpt
    image: mautrix-chatgpt:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - UID=1000
      - GID=1000
    # Minimal resource requirements (no heavy Agent SDK)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

