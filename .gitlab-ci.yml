stages:
  - docker
  - publish

variables:
  REGISTRY: dev.wn:5000
  IMAGE_NAME: mautrix-chatgpt

docker:
  stage: docker
  tags:
    - shell
  script:
    - |
      cat > /tmp/buildkitd.toml << 'TOML'
      [registry."dev.wn:5000"]
        http = true
        insecure = true
      TOML
    - docker rm -f buildx_buildkit_multiarch0 2>/dev/null || true
    - docker buildx rm --force multiarch 2>/dev/null || true
    - docker buildx create --use --name multiarch --config /tmp/buildkitd.toml --bootstrap
    - |
      TAGS="-t ${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      if echo "${CI_COMMIT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        SEMVER="${CI_COMMIT_TAG#v}"
        MAJOR=$(echo "$SEMVER" | cut -d. -f1)
        MINOR=$(echo "$SEMVER" | cut -d. -f1-2)
        TAGS="$TAGS -t ${REGISTRY}/${IMAGE_NAME}:${SEMVER}"
        TAGS="$TAGS -t ${REGISTRY}/${IMAGE_NAME}:${MINOR}"
        TAGS="$TAGS -t ${REGISTRY}/${IMAGE_NAME}:${MAJOR}"
        TAGS="$TAGS -t ${REGISTRY}/${IMAGE_NAME}:latest"
        VERSION="$SEMVER"
      else
        TAGS="$TAGS -t ${REGISTRY}/${IMAGE_NAME}:latest"
        VERSION="0.1.0-dev.${CI_COMMIT_SHORT_SHA}"
      fi
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg COMMIT_HASH=${CI_COMMIT_SHA} \
        --build-arg BUILD_TIME=$(date -Iseconds) \
        --build-arg VERSION=${VERSION} \
        ${TAGS} \
        --push \
        .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: manual

dockerhub:
  stage: publish
  tags:
    - shell
  needs:
    - docker
  script:
    - |
      cat > /tmp/buildkitd.toml << 'TOML'
      [registry."dev.wn:5000"]
        http = true
        insecure = true
      TOML
    - docker rm -f buildx_buildkit_multiarch0 2>/dev/null || true
    - docker buildx rm --force multiarch 2>/dev/null || true
    - docker buildx create --use --name multiarch --config /tmp/buildkitd.toml --bootstrap
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
    - |
      SEMVER="${CI_COMMIT_TAG#v}"
      MAJOR=$(echo "$SEMVER" | cut -d. -f1)
      MINOR=$(echo "$SEMVER" | cut -d. -f1-2)
      DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
      docker buildx imagetools create \
        -t ${DOCKERHUB_IMAGE}:${SEMVER} \
        -t ${DOCKERHUB_IMAGE}:${MINOR} \
        -t ${DOCKERHUB_IMAGE}:${MAJOR} \
        -t ${DOCKERHUB_IMAGE}:latest \
        ${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker logout
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: always

